services:
  tycoon-drug:
    build: .
    image: tycoon-drug:latest
    container_name: tycoon-drug
    ports:
      - "${PORT:-2567}:2567"
    restart: unless-stopped
    environment:
      - MAX_PER_IP=3
      # - TRUST_PROXY=1                              # si derrière Nginx / Traefik / Caddy
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}            # panneau admin (F9) : mets ton mot de passe dans un fichier .env
      # - ALLOWED_ORIGINS=https://jeu.mondomaine.fr  # n'accepter que ton domaine
